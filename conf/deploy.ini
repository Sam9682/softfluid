DOMAIN=softfluid.com
PLTF_NAME=SoftFluid-Explorer_AI_SharedGPU_Docker_Serverless
PLTF_FOLDER=softfluid-explorer
VERSION=0.0.1

# Number of consecutive ports allocated per application (6 HTTP + 6 HTTPS).
# Must match calculate_ports() in deployControlPlan.sh and
# calculate_app_ports() in src/database_postgres.py.
RANGE_PORTS_PER_APPLICATION=12

# Linux system user used for installation paths (e.g. /home/<user>)
LINUX_USER_INSTALLATION=softfluid

# Secondary domains (comma-separated list)
# Format: "domain1:server_names:proxy_pass,domain2:server_names:proxy_pass"
# Example: "softfluid.com:softfluid.com www.softfluid.com:www.softfluid.com"
SECONDARY_DOMAINS=
